<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="content">
        <div id="new-grid-container">
            <label for="new-grid-slider" id="grid-size-label">New grid</label>
            <input type="range" id="new-grid-slider" name="new-grid-slider" min="1" max="100">
        </div>

        <div id="ui-container">
            <div id="color-input-text">Set your color here:</div>
            <div><input type="color" name="color-input" id="color-input"></div>
            <button id="reset-fields-button">Reset canvas</button>
        </div>

        <div id="drawing-container-container"></div>
    </div>

    <div class="footer">
        Copyright &nbsp;© &nbsp;MetallicCrimson 2026
    </div>
</body>
</html>
